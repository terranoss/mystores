name: mystores
description: MyStores — Multi-store Shopee & Lazada management dashboard.
publish_to: 'none'

version: 1.0.5+6

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # HTTP
  dio: ^5.7.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Navigation
  go_router: ^14.6.2

  # Charts
  fl_chart: ^0.70.2

  # Camera for picklist photo capture
  image_picker: ^1.1.2

  # QR Code Scanner for dynamic store connection
  mobile_scanner: ^6.0.4

  # Infinite scroll / pagination
  infinite_scroll_pagination: ^4.0.0

  # Open URLs (OAuth)
  url_launcher: ^6.3.1

  # App version for About / drawer
  package_info_plus: ^8.1.2

  # Android home screen widget
  home_widget: ^0.9.3

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon_master_1024.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
